
name: TRAG 24 - RSS analize

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6,14,19 * * *'

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generisi RSS sa slikama i cistim tekstom
        run: |
          python - <<'PY'
          import json, html, re, datetime as dt, email.utils
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urljoin

          site = 'https://trag24-srbija.github.io/trag24-portal/'
          data = json.loads(Path('analize.json').read_text(encoding='utf-8'))
          rss = ET.Element('rss', {'version': '2.0', 'xmlns:media': 'http://search.yahoo.com/mrss/'})
          ch = ET.SubElement(rss, 'channel')

          for key, val in [
              ('title', 'TRAG 24 - Analize'),
              ('link', site + 'analize.html'),
              ('description', 'Analize i pregledi izvora TRAG 24'),
              ('language', 'sr-RS')
          ]:
              ET.SubElement(ch, key).text = val

          seen = set()

          for a in sorted(
              data.get('analize', []),
              key=lambda x: x.get('datum', ''),
              reverse=True
          ):
              if a.get('status') != 'objavljeno':
                  continue

              uid = str(a.get('id', '')).strip()
              title = html.unescape(str(a.get('naslov', '')).strip())

              if not uid or not title or uid in seen:
                  continue

              seen.add(uid)
              item = ET.SubElement(ch, 'item')

              ET.SubElement(item, 'title').text = title
              ET.SubElement(item, 'link').text = site + 'analize.html'
              ET.SubElement(
                  item, 'guid', {'isPermaLink': 'false'}
              ).text = uid

              paragraphs = a.get('tekst', [])
              if not isinstance(paragraphs, list):
                  paragraphs = [paragraphs]

              clean = []
              for p in paragraphs:
                  p = html.unescape(
                      re.sub(r'<[^>]+>', ' ', str(p))
                  )
                  p = re.sub(r'\s+', ' ', p).strip()
                  if p:
                      clean.append(p)

              full = ' '.join(clean[:2])
              summary = full[:420]
              if len(full) > 420:
                  summary += '…'

              ET.SubElement(
                  item, 'description'
              ).text = summary

              image = str(
                  a.get('slika') or a.get('image') or ''
              ).strip()

              if image:
                  image_url = urljoin(site, image)

                  ET.SubElement(
                      item,
                      '{http://search.yahoo.com/mrss/}content',
                      {'url': image_url, 'medium': 'image'}
                  )

                  ET.SubElement(
                      item,
                      'enclosure',
                      {
                          'url': image_url,
                          'type': 'image/png' if image.lower().endswith('.png') else 'image/jpeg',
                          'length': '0'
                      }
                  )

              try:
                  date = dt.datetime.fromisoformat(
                      str(a['datum']).replace('Z', '+00:00')
                  )
                  if date.tzinfo is None:
                      date = date.replace(
                          tzinfo=dt.timezone.utc
                      )
                  ET.SubElement(
                      item, 'pubDate'
                  ).text = email.utils.format_datetime(date)
              except (KeyError, ValueError, TypeError):
                  pass

              if len(seen) >= 30:
                  break

          ET.indent(rss, space='  ')
          ET.ElementTree(rss).write(
              'analize-feed.xml',
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Sacuvaj RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analize-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "TRAG 24: RSS analize sa slikama"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
