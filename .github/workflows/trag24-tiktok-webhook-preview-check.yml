name: TRAG24 - TikTok webhook test BEZ OBJAVE

on:
  push:
    branches: ['feature/trag24-reels-six-programs-20261121']
    paths: ['.github/workflows/trag24-tiktok-webhook-preview-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview_only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Proveri da paket ne moze da objavi video
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('docs/make-webhook-sest-proba.json').read_text(encoding='utf-8'))
          assert v['mode']=='PREVIEW_ONLY' and v['test_only'] is True
          assert v['publish_enabled'] is False and len(v['posts'])==6
          assert all(p['publishing_enabled'] is False and p['media_url'] is None
                     and p['destinations']['tiktok']['status']=='HOLD_REVIEW'
                     for p in v['posts'])
          print('SAFE: 6 TikTok preview items. Publishing disabled.')
          PY
      - name: Posalji samo TikTok Make webhooku
        env:
          TIKTOK_HOOK: ${{ secrets.MAKE_TIKTOK_REELS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TIKTOK_HOOK:-}" ]; then
            echo "::error::Nedostaje GitHub secret MAKE_TIKTOK_REELS_WEBHOOK_URL"
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 --retry 0 \
            -X POST -H 'Content-Type: application/json' \
            --data-binary @docs/make-webhook-sest-proba.json \
            -o /tmp/make-tiktok-probe-response.txt \
            -w '%{http_code}' "$TIKTOK_HOOK")
          case "$status" in
            200|201|202) echo "TikTok Make webhook primio probni paket. HTTP $status. BEZ OBJAVE.";;
            *) echo "::error::TikTok Make nije prihvatio paket. HTTP $status"; exit 1;;
          esac
