name: TRAG 24 - vremenska prognoza

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_weather.py'
      - '.github/workflows/trag24-vreme.yml'
  schedule:
    # Srbija: na 6 sati; vreme RSS prikupljanja ostaje na 15 minuta.
    - cron: '41 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: trag24-vremenska-prognoza
  cancel-in-progress: false

jobs:
  prognoza:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4
      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preuzmi prognozu od MET Norway
        run: python scripts/update_weather.py
      - name: Sačuvaj prognozu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f weather.json ]; then git add weather.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "TRAG 24: osvezena vremenska prognoza"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
