name: TRAG 24 - Novac i život - proba
on:
  push:
    paths: ['.github/workflows/trag24-novac-proba.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tekst za naratorku
        run: |
          cat > vesti.txt <<'TEKST'
          Novac i život. Kako živimo u Srbiji? U oktobru je godišnja inflacija iznosila četiri zarez četiri odsto, a u septembru četiri zarez jedan odsto.
          U odnosu na septembar, odeća i obuća poskupele su dva zarez četiri odsto, a hrana i bezalkoholna pića jedan zarez sedam odsto.
          Prosečna neto plata u septembru bila je sto devetnaest hiljada trista trideset pet dinara. Polovina zaposlenih primila je do devedeset četiri hiljade osamsto dvadeset devet dinara.
          Prosečna penzija za oktobar iznosila je pedeset šest hiljada osamsto trideset osam dinara.
          Minimalna cena rada u dve hiljade dvadeset šestoj je trista sedamdeset jedan dinar neto po satu. Za sto sedamdeset šest sati, to je šezdeset pet hiljada dvesta devedeset šest dinara.
          Posetite portal Trag dvadeset četiri tačka er es.
          TEKST
      - name: Gemini Kore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg
          VOICE=Kore
          i=0
          while IFS= read -r segment; do
            i=$((i+1))
            jq -n --arg voice "$VOICE" --arg text "Pročitaj kao smirena spikerka televizijskih vesti na srpskom, ekavski: $segment" '{contents:[{parts:[{text:$text}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$voice}}}}}' > request.json
            curl -fsS --retry 3 --retry-delay 6 --retry-max-time 240 --max-time 120 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' -d @request.json > response.json
            jq -er '.candidates[0].content.parts[0].inlineData.data' response.json | base64 -d > "glas-$i.pcm"
            ffmpeg -nostdin -loglevel error -f s16le -ar 24000 -ac 1 -i "glas-$i.pcm" "glas-$i.wav"
            test -s "glas-$i.wav"
          done < vesti.txt

      - uses: actions/upload-artifact@v4
        with:
          name: novac-i-zivot-naracija
          path: glas-*.wav
          retention-days: 2
          if-no-files-found: error
