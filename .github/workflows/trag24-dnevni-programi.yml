name: TRAG 24 - PREMIUM DNEVNI PROGRAMI

on:
  push:
    paths:
      - 'scripts/generate_daily_programs.py'
      - '.github/workflows/trag24-dnevni-programi.yml'
  workflow_dispatch:
    inputs:
      program:
        description: 'Emisija koju treba pripremiti'
        required: true
        default: '11'
        type: choice
        options:
          - '11'
          - '14'
          - '17'
          - '23'
      date:
        description: 'Datum YYYY-MM-DD (prazno = danas)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '45 10 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 13 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 16 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 22 * * *'
      timezone: 'Europe/Belgrade'

permissions:
  contents: write

concurrency:
  group: trag24-premium-dnevni-programi
  cancel-in-progress: false

jobs:
  test-dizajna:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --only-binary=:all: Pillow
      - name: Proveri Python i svih pet dizajna
        run: |
          python -m py_compile scripts/generate_daily_programs.py
          python - <<'PY'
          import datetime as dt
          from scripts.generate_daily_programs import make_card
          item = {
              'title': 'Izmene saobraćaja u Beogradu zbog održavanja polumaratona',
              'summary': 'Danas su na pojedinim trasama izmenjene linije gradskog prevoza.',
              'sources': ['nova.rs', 'danas.rs'],
          }
          for hour in ('11', '14', '17', '20', '23'):
              image = make_card(hour, dt.date(2026, 11, 22), item)
              assert image.size == (1080, 1920), hour
              print('Dizajn OK:', hour)
          PY
  nacrti:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Belgrade
    steps:
      - name: Repo
        uses: actions/checkout@v4
      - name: Odredi termin emisije
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PROGRAM=$(jq -r '.inputs.program' "$GITHUB_EVENT_PATH")
            DATE_OVERRIDE=$(jq -r '.inputs.date // ""' "$GITHUB_EVENT_PATH")
          else
            SCHEDULE=$(jq -r '.schedule' "$GITHUB_EVENT_PATH")
            case "$SCHEDULE" in
              '45 10 * * *') PROGRAM=11;;
              '45 13 * * *') PROGRAM=14;;
              '45 16 * * *') PROGRAM=17;;
              '45 22 * * *') PROGRAM=23;;
              *) echo "Nepoznat termin: $SCHEDULE"; exit 1;;
            esac
            DATE_OVERRIDE=""
          fi
          echo "PROGRAM=$PROGRAM" >> "$GITHUB_ENV"
          echo "DATE_OVERRIDE=$DATE_OVERRIDE" >> "$GITHUB_ENV"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: pip install --only-binary=:all: Pillow
      - name: Generisi odgovarajuci premium nacrt
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$PROGRAM" in 11|14|17|23) ;; *) echo "Neispravan termin"; exit 1;; esac
          if [ -n "$DATE_OVERRIDE" ]; then
            python scripts/generate_daily_programs.py --program "$PROGRAM" --date "$DATE_OVERRIDE"
          else
            python scripts/generate_daily_programs.py --program "$PROGRAM"
          fi
          IMAGE=$(find program_output -maxdepth 1 -type f -name "TRAG24-$PROGRAM-*.png" -print -quit 2>/dev/null || true)
          if [ -n "$IMAGE" ] && [ -s "$IMAGE" ] && [ -s "${IMAGE%.png}.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "meta=${IMAGE%.png}.json" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nema odgovarajuce teme; ne pravim praznu ili izmisljenu vest."
          fi
      - name: Sacuvaj nacrt za pregled
        if: steps.image.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TRAG24-PREMIUM-${{ env.PROGRAM }}
          path: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.meta }}
          retention-days: 7
      - name: Sacuvaj nacrt u GitHub Releases
        if: steps.image.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(python -c 'import json,sys;print(json.load(open(sys.argv[1], encoding="utf-8"))["datum"])' "${{ steps.image.outputs.meta }}")
          TAG="premium-$PROGRAM-$DATE"
          IMAGE="${{ steps.image.outputs.image }}"
          META="${{ steps.image.outputs.meta }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IMAGE" "$META" --clobber
          else
            gh release create "$TAG" "$IMAGE" "$META" --draft --target "$GITHUB_SHA" --title "TRAG 24 - PREMIUM $PROGRAM - $DATE" --notes "Premium dnevni nacrt. Nije automatski objavljen na drustvenim mrezama." --latest=false
          fi
