

name: TRAG 24 - RSS analize

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_analysis_social.py'
      - '.github/workflows/trag24-analize-rss.yml'
  workflow_run:
    workflows: ['TRAG 24 - automatska obrada analiza']
    types: [completed]
  schedule:
    - cron: '10 6,14,19 * * *'

permissions:
  contents: write

concurrency:
  group: trag24-analize-social-pages
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generisi posebne stranice i RSS sa slikama
        run: python scripts/build_analysis_social.py

      - name: Sacuvaj nove stranice i RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analiza/ analize-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "TRAG 24: posebne stranice analiza i slike za Facebook"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
