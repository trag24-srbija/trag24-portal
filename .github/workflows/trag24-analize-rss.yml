
name: TRAG 24 - RSS analize

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6,14,19 * * *'

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generisi RSS analiza
        run: |
          python - <<'PY'
          import json
          import html
          import datetime as dt
          import email.utils
          import xml.etree.ElementTree as ET
          from pathlib import Path

          site = "https://trag24-srbija.github.io/trag24-portal/"
          data = json.loads(Path("analize.json").read_text(encoding="utf-8"))
          rss = ET.Element("rss", version="2.0")
          channel = ET.SubElement(rss, "channel")

          for key, val in {
              "title": "TRAG 24 - Analize",
              "link": site + "analize.html",
              "description": "Analize i pregledi izvora TRAG 24",
              "language": "sr-RS"
          }.items():
              ET.SubElement(channel, key).text = val

          seen = set()
          for a in sorted(data.get("analize", []),
                          key=lambda x: x.get("datum", ""), reverse=True):
              if a.get("status") != "objavljeno":
                  continue
              uid = str(a.get("id", ""))
              if not uid or uid in seen:
                  continue
              seen.add(uid)
              item = ET.SubElement(channel, "item")
              ET.SubElement(item, "title").text = a.get("naslov", "")
              ET.SubElement(item, "link").text = site + "analize.html"
              ET.SubElement(item, "guid", isPermaLink="false").text = uid
              tekst = a.get("tekst", [])
              opis = " ".join(tekst[:3]) if isinstance(tekst, list) else str(tekst)
              ET.SubElement(item, "description").text = opis[:900]
              try:
                  datum = dt.datetime.fromisoformat(a["datum"])
                  datum = datum.replace(tzinfo=dt.timezone.utc)
                  ET.SubElement(item, "pubDate").text = email.utils.format_datetime(datum)
              except (ValueError, KeyError):
                  pass
              if len(seen) >= 30:
                  break

          ET.indent(rss, space="  ")
          ET.ElementTree(rss).write(
              "analize-feed.xml",
              encoding="utf-8",
              xml_declaration=True
          )
          PY
      - name: Sacuvaj RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analize-feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "TRAG 24: RSS analize"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
