name: TRAG 24 - PREMIUM DNEVNI PROGRAMI

on:
  push:
    paths:
      - 'scripts/generate_daily_programs.py'
      - '.github/workflows/trag24-dnevni-programi.yml'
  workflow_dispatch:
    inputs:
      program:
        description: 'Izaberi emisiju'
        required: true
        default: '11'
        type: choice
        options: ['11', '14', '17', '23']
      date:
        description: 'Datum YYYY-MM-DD (prazno = danas)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '45 10 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 13 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 16 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 22 * * *'
      timezone: 'Europe/Belgrade'

permissions:
  contents: write

concurrency:
  group: trag24-premium-dnevni-programi
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instaliraj alat za slike
        run: pip install --only-binary=:all: Pillow
      - name: Proveri sablone ili pripremi dnevni nacrt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Europe/Belgrade
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_daily_programs.py
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python - <<'PY'
          import datetime as dt
          from scripts.generate_daily_programs import make_card
          item = {
              "title": "Izmene saobraćaja u Beogradu zbog polumaratona",
              "summary": "Saobraćaj je izmenjen na nekoliko lokacija.",
              "sources": ["nova.rs", "danas.rs"]
          }
          for hour in ("11", "14", "17", "20", "23"):
              im = make_card(hour, dt.date(2026, 11, 22), item)
              assert im.size == (1080, 1920)
              print("TEMPLATE OK", hour)
          PY
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PROGRAM=$(jq -r '.inputs.program' "$GITHUB_EVENT_PATH")
            DATE_OVERRIDE=$(jq -r '.inputs.date // ""' "$GITHUB_EVENT_PATH")
          else
            EXPRESSION=$(jq -r '.schedule' "$GITHUB_EVENT_PATH")
            case "$EXPRESSION" in
              '45 10 * * *') PROGRAM=11;;
              '45 13 * * *') PROGRAM=14;;
              '45 16 * * *') PROGRAM=17;;
              '45 22 * * *') PROGRAM=23;;
              *) echo "Nepoznat raspored"; exit 1;;
            esac
            DATE_OVERRIDE=""
          fi
          case "$PROGRAM" in 11|14|17|23) ;; *) echo "Nepoznat program"; exit 1;; esac
          if [ -n "$DATE_OVERRIDE" ]; then
            python scripts/generate_daily_programs.py --program "$PROGRAM" --date "$DATE_OVERRIDE"
          else
            python scripts/generate_daily_programs.py --program "$PROGRAM"
          fi
          IMAGE=$(find program_output -maxdepth 1 -type f -name "TRAG24-$PROGRAM-*.png" -print -quit 2>/dev/null || true)
          if [ -z "$IMAGE" ]; then
            echo "Nema sveze odgovarajuce teme; preskacem nacrt."
            exit 0
          fi
          META="${IMAGE%.png}.json"
          test -s "$IMAGE"
          test -s "$META"
          DATE=$(python -c 'import sys,json;print(json.load(open(sys.argv[1],encoding="utf8"))["datum"])' "$META")
          TAG="premium-$PROGRAM-$DATE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IMAGE" "$META" --clobber
          else
            gh release create "$TAG" "$IMAGE" "$META" --draft --target "$GITHUB_SHA" --title "TRAG 24 - $PROGRAM - $DATE" --notes "Premium nacrt za pregled. Bez automatskog objavljivanja na drustvenim mrezama." --latest=false
          fi
