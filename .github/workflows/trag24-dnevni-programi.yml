name: TRAG 24 - PREMIUM DNEVNI PROGRAMI

on:
  push:
    paths:
      - 'scripts/generate_daily_programs.py'
      - '.github/workflows/trag24-dnevni-programi.yml'
  workflow_dispatch:
    inputs:
      program:
        description: 'Emisija koju treba pripremiti'
        required: true
        default: '11'
        type: choice
        options:
          - '11'
          - '14'
          - '17'
          - '23'
      date:
        description: 'Datum YYYY-MM-DD (prazno = danas)'
        required: false
        default: ''
        type: string
      approve_publish:
        description: 'Odobri javnu objavu ovog novog videa u Make-u (bez objave starih testova)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '0 14 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '0 17 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '0 23 * * *'
      timezone: 'Europe/Belgrade'

permissions:
  contents: write

concurrency:
  group: trag24-premium-dnevni-programi
  cancel-in-progress: false

jobs:
  test-dizajna:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'pip install --only-binary=:all: Pillow imageio-ffmpeg==0.6.0'
      - name: Proveri Python i svih pet dizajna
        run: |
          python -m py_compile scripts/generate_daily_programs.py
          python - <<'PY'
          import datetime as dt
          from scripts.generate_daily_programs import make_card
          item = {
              'title': 'Izmene saobraćaja u Beogradu zbog održavanja polumaratona',
              'summary': 'Danas su na pojedinim trasama izmenjene linije gradskog prevoza.',
              'sources': ['nova.rs', 'danas.rs'],
          }
          for hour in ('11', '14', '17', '20', '23'):
              image = make_card(hour, dt.date(2026, 11, 22), item)
              assert image.size == (1080, 1920), hour
              if hour == '23':
                  image.save('arena-test.png')
              print('Dizajn OK:', hour)
          PY
      - name: Probni video sa odobrenog dizajna
        run: |
          python scripts/render_premium_short_video.py --image arena-test.png --output arena-test.mp4
          test -s arena-test.mp4
      - name: Proveri Make paket (bez objavljivanja)
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from scripts.prepare_make_premium_payload import build
          meta = {
            "datum": "2026-11-22", "sat": "23:00",
            "program": "ARENA",
            "vest": {
              "title": "5 PITANJA. JEDAN IZAZOV.",
              "summary": "Proveri znanje, osvoji poene i izazovi prijatelja.",
              "sources": []
            }
          }
          p = build("23", dt.date(2026,11,22), meta, Path("arena-test.mp4"), "12345")
          assert p["publish_enabled"] is False and p["test_only"] is True
          assert p["github_run_id"] == "12345" and len(p["posts"]) == 1
          assert p["posts"][0]["media_file"].endswith(".mp4")
          assert p["posts"][0]["media_url"] is None
          approved = build("23", dt.date(2026,11,22), meta, Path("arena-test.mp4"), "12345", approved=True)
          assert approved["posts"][0]["media_url"].endswith("/premium-23-2026-11-22/arena-test.mp4")
          print("MAKE PACKET TEST OK")
          PY
      - name: Pripremi danasnje premium Reels nacrte
        env:
          TZ: Europe/Belgrade
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Belgrade date +%F)
          for PROGRAM in 11 14 17 23; do
            python scripts/generate_daily_programs.py --program "$PROGRAM" --date "$TODAY"
            IMAGE="program_output/TRAG24-$PROGRAM-$TODAY.png"
            VIDEO="program_output/TRAG24-$PROGRAM-$TODAY.mp4"
            if [ ! -s "$IMAGE" ]; then
              echo "Nema odgovarajuce pouzdane teme za $PROGRAM:00; preskacem."
              continue
            fi
            python scripts/render_premium_short_video.py --image "$IMAGE" --output "$VIDEO"
            test -s "$VIDEO"
          done
      - name: Sacuvaj danasnje Reels snimke za pregled
        uses: actions/upload-artifact@v4
        with:
          name: TRAG24-PREMIUM-DANAS
          path: |
            program_output/TRAG24-*.png
            program_output/TRAG24-*.mp4
            program_output/TRAG24-*.json
          retention-days: 7
          if-no-files-found: warn
  nacrti:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Belgrade
    steps:
      - name: Repo
        uses: actions/checkout@v4
      - name: Odredi termin emisije
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PROGRAM=$(jq -r '.inputs.program' "$GITHUB_EVENT_PATH")
            DATE_OVERRIDE=$(jq -r '.inputs.date // ""' "$GITHUB_EVENT_PATH")
          else
            SCHEDULE=$(jq -r '.schedule' "$GITHUB_EVENT_PATH")
            case "$SCHEDULE" in
              '0 11 * * *') PROGRAM=11;;
              '0 14 * * *') PROGRAM=14;;
              '0 17 * * *') PROGRAM=17;;
              '0 23 * * *') PROGRAM=23;;
              *) echo "Nepoznat termin: $SCHEDULE"; exit 1;;
            esac
            DATE_OVERRIDE=""
          fi
          echo "PROGRAM=$PROGRAM" >> "$GITHUB_ENV"
          echo "DATE_OVERRIDE=$DATE_OVERRIDE" >> "$GITHUB_ENV"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: 'pip install --only-binary=:all: Pillow imageio-ffmpeg==0.6.0'
      - name: Generisi odgovarajuci premium nacrt
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$PROGRAM" in 11|14|17|23) ;; *) echo "Neispravan termin"; exit 1;; esac
          if [ -n "$DATE_OVERRIDE" ]; then
            python scripts/generate_daily_programs.py --program "$PROGRAM" --date "$DATE_OVERRIDE"
          else
            python scripts/generate_daily_programs.py --program "$PROGRAM"
          fi
          IMAGE=$(find program_output -maxdepth 1 -type f -name "TRAG24-$PROGRAM-*.png" -print -quit 2>/dev/null || true)
          if [ -n "$IMAGE" ] && [ -s "$IMAGE" ] && [ -s "${IMAGE%.png}.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "meta=${IMAGE%.png}.json" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Nema odgovarajuce teme; ne pravim praznu ili izmisljenu vest."
          fi
      - name: Pripremi MP4 Reel od odobrene premium kartice
        if: steps.image.outputs.ready == 'true'
        id: reel
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.image }}"
          VIDEO="${IMAGE%.png}.mp4"
          python scripts/render_premium_short_video.py --image "$IMAGE" --output "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
      - name: Sacuvaj nacrt za pregled
        if: steps.image.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TRAG24-PREMIUM-${{ env.PROGRAM }}
          path: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.meta }}
            ${{ steps.reel.outputs.video }}
          retention-days: 7
      - name: Sacuvaj nacrt u GitHub Releases
        if: steps.image.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_APPROVED: ${{ inputs.approve_publish || false }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(python -c 'import json,sys;print(json.load(open(sys.argv[1], encoding="utf-8"))["datum"])' "${{ steps.image.outputs.meta }}")
          TAG="premium-$PROGRAM-$DATE"
          IMAGE="${{ steps.image.outputs.image }}"
          META="${{ steps.image.outputs.meta }}"
          VIDEO="${{ steps.reel.outputs.video }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IMAGE" "$VIDEO" "$META" --clobber
          else
            gh release create "$TAG" "$IMAGE" "$VIDEO" "$META" --draft --target "$GITHUB_SHA" --title "TRAG 24 - PREMIUM $PROGRAM - $DATE" --notes "Premium dnevni nacrt. Nije automatski objavljen na drustvenim mrezama." --latest=false
          fi
          # Only authorised public episodes become publicly fetchable for Instagram.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_APPROVED" = "true" ]; }; then
            gh release edit "$TAG" --draft=false --latest=false \
              --notes "Odobrena TRAG 24 emisija $PROGRAM:00 ($DATE). Video dostupan za objavu na drustvenim mrezama."
            test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
            echo "Public MP4 ready at: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$VIDEO")"
          else
            echo "Preview remains a private release draft."
          fi

      - name: Pripremi Make paket za novu emisiju
        if: steps.image.outputs.ready == 'true'
        env:
          HOOK: ${{ secrets.MAKE_REELS_TEST_WEBHOOK_URL }}
          IG_HOOK: ${{ secrets.MAKE_INSTAGRAM_REELS_WEBHOOK_URL }}
          TIKTOK_HOOK: ${{ secrets.MAKE_TIKTOK_REELS_WEBHOOK_URL }}
          MANUAL_APPROVED: ${{ inputs.approve_publish || false }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.image }}"
          VIDEO="${{ steps.reel.outputs.video }}"
          META="${{ steps.image.outputs.meta }}"
          DATE=$(python -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8"))["datum"])' "$META")
          PACKET="program_output/TRAG24-MAKE-$PROGRAM-$DATE.json"
          APPROVAL=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_APPROVED" = "true" ]; }; then
            APPROVAL=(--approved)
          fi
          python scripts/prepare_make_premium_payload.py \
            --program "$PROGRAM" --date "$DATE" \
            --metadata "$META" --video "$VIDEO" \
            --github-run-id "$GITHUB_RUN_ID" --out "$PACKET" "${APPROVAL[@]}"
          # Official automatic editions can be published only with the Make filter
          # publish_enabled=true, a matching MP4 filename, and deduplication.
          # Manual runs require approve_publish=true; normal manual previews stay private.
          if [ -n "${HOOK:-}" ]; then
            HTTP_CODE=$(curl --silent --show-error --max-time 30 --retry 0 \
              -X POST -H 'Content-Type: application/json' \
              --data-binary @"$PACKET" \
              -o /tmp/make-facebook-response.json -w '%{http_code}' "$HOOK")
            case "$HTTP_CODE" in
              200|201|202) echo "Facebook Make prihvatio paket za $PROGRAM:00 (HTTP $HTTP_CODE), approval=${#APPROVAL[@]}";;
              *) echo "::error::Facebook Make nije prihvatio paket: HTTP $HTTP_CODE"; exit 1;;
            esac
          else
            echo "::notice::Facebook Make webhook nije povezan; nema Facebook slanja."
          fi
          # Separate Make webhook: Instagram scenario stays inactive until user finishes its configuration.
          # Never print webhook secret URL in logs.
          if [ -n "${IG_HOOK:-}" ]; then
            IG_HTTP_CODE=$(curl --silent --show-error --max-time 30 --retry 0 \
              -X POST -H 'Content-Type: application/json' \
              --data-binary @"$PACKET" \
              -o /tmp/make-instagram-response.json -w '%{http_code}' "$IG_HOOK")
            case "$IG_HTTP_CODE" in
              200|201|202) echo "Instagram Make prihvatio paket za $PROGRAM:00 (HTTP $IG_HTTP_CODE), approval=${#APPROVAL[@]}";;
              *) echo "::error::Instagram Make nije prihvatio paket: HTTP $IG_HTTP_CODE"; exit 1;;
            esac
          else
            echo "::notice::Instagram Make webhook nije povezan; nema Instagram slanja."
          fi
          if [ -n "${TIKTOK_HOOK:-}" ]; then
            TT_HTTP_CODE=$(curl --silent --show-error --max-time 30 --retry 0 \
              -X POST -H 'Content-Type: application/json' \
              --data-binary @"$PACKET" \
              -o /tmp/make-tiktok-response.json -w '%{http_code}' "$TIKTOK_HOOK")
            case "$TT_HTTP_CODE" in
              200|201|202) echo "TikTok Make webhook prihvatio paket (HTTP $TT_HTTP_CODE).";;
              *) echo "::error::TikTok Make nije prihvatio paket: HTTP $TT_HTTP_CODE"; exit 1;;
            esac
          else
            echo "::notice::TikTok Make webhook nije povezan; nema TikTok slanja."
          fi
