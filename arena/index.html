function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawQuestions(mode,count,city){const pool=candidateQuestions(mode,city);if(pool.length<count)return [];let fresh=pool.filter(q=>!state.seen.includes(q.id));if(fresh.length<count){state.seen=[];fresh=pool.slice()}const picked=shuffled(fresh).slice(0,count);state.seen.push(...picked.map(q=>q.id));state.seen=state.seen.slice(-allQuestions.length);persist();return picked}

function beginLocal(mode,params={}){const count=mode==='large'?15:mode==='city'?params.count||5:5;const questions=drawQuestions(mode,count,params.city);if(!questions.length){toast('Za ovaj izazov još nema dovoljno odobrenih pitanja.');return}run={mode,official:false,questions,idx:0,points:0,correct:0,answers:[],jokerUsed:{half:false,extra:false,double:false},jokerQuestionCount:0,risk:false,streak:0,bestStreak:0,feedback:null,questionStart:Date.now(),deadline:Date.now()+15000,done:false,city:params.city||null,removed:[],seconds:15};page='quiz';render();startTimer()}

function currentQ(){return run?.official?run.currentQuestion:run?.questions?.[run.idx]}
function layoutQuiz(){if(!run)return empty('Partija nije pokrenuta.');const q=currentQ();if(!q)return empty('Nema sledećeg pitanja.');const qNumber=run.idx+1,total=run.official?run.total:run.questions.length;const fb=run.feedback;const options=q.options||[];const remain=run.seconds??15;const canUse=!fb&&!run.done;return `<div class="quiz-meta"><span>PITANJE ${qNumber} / ${total}</span><span class="gold">★ ${nfmt(run.points)} poena</span></div><div class="quiz-progress"><div style="width:${100*(qNumber-1)/total}%"></div></div><div class="row between"><div><span class="eyebrow">${esc(q.category)}</span><p class="small muted" style="margin:7px 0 0">${run.mode==='city'?esc(run.city)+' · ':''}${run.official?'Zvanični izazov':'Probna partija'}</p></div><div class="timer ${remain<=5?'urgent':''}" id="clock-value">${fb?'—':remain}</div></div><div class="question-shell"><h2>${esc(q.question)}</h2></div><div class="stack">${options.map((answer,i)=>{let cls='';if(fb){if(i===fb.correctIndex)cls='good';else if(i===fb.choice)cls='bad';}if(run.removed?.includes(i))cls+=' removed';return `<button type="button" class="option ${cls}" data-action="answer" data-answer="${i}" ${fb||run.removed?.includes(i)?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(answer)}</span></button>`}).join('')}</div><div class="lifelines"><button class="lifeline" data-action="half" ${canUse&&!run.jokerUsed.half&&!run.risk?'':'disabled'}><span class="emoji">½</span>50:50</button><button class="lifeline" data-action="extra" ${canUse&&!run.jokerUsed.extra&&!run.risk?'':'disabled'}><span class="emoji">◷</span>+10 sek.</button><button class="lifeline risk" data-action="double" ${canUse&&!run.jokerUsed.double&&run.jokerQuestionCount===0?'':'disabled'}><span class="emoji">×2</span>${run.risk?'AKTIVNO':'RIZIK ×2'}</button></div><p class="tiny muted" style="margin-top:11px">${run.risk?'Rizik aktiviran: dupli poeni, bez pomoći.':run.jokerQuestionCount?'Pomoć je aktivirana; poeni na pitanju su umanj function submitLocal(choice){if(!run||run.feedback||run.done||run.official)return;endTimer();const q=currentQ();const correct=choice===q.correct_index;const t=Math.max(0,Math.min(15,Math.ceil((run.deadline-Date.now())/1000)));if(correct){run.correct++;run.streak++;run.bestStreak=Math.max(run.bestStreak,run.streak)}else run.streak=0;const bonus=correct?Math.min(60,Math.max(0,(run.streak-1)*20)):0;const base=100+10*t+bonus;const awarded=correct?Math.round(base*(run.jokerQuestionCount?Math.pow(.7,run.jokerQuestionCount):1)*(run.risk?2:1)):0;run.points+=awarded;run.answers.push({id:q.id,category:q.category,correct,points:awarded});run.feedback={correct,choice,correctIndex:q.correct_index,awarded,explanation:q.explanation,source:q.analysis_url||q.source_url};render()}

async function useJoker(j){
 if(!run||run.feedback||run.done||run.jokerUsed[j])return;
 if(j==='double'&&run.jokerQuestionCount)return;
 if(run.risk&&j!=='double')return;
 if(run.official){
   try{
     const res=await api('help',{session_id:run.sessionId,type:j});
     if(j==='half')run.removed=res.removed_indexes||[];
     if(j==='extra'&&res.deadline_at)run.deadline=Date.parse(res.deadline_at);
   }catch(e){toast('Džoker nije iskorišćen: '+e.message);return}
 }
 run.jokerUsed[j]=true;
 if(j==='double'){run.risk=true}
 else{
   run.jokerQuestionCount++;
   if(!run.official){
     if(j==='half'){
       const q=currentQ();const idx=q?.correct_index;
       run.removed=shuffled([0,1,2,3].filter(i=>i!==idx)).slice(0,2);
     }else if(j==='extra')run.deadline+=10000;
   }
 }
 render();
}

function layoutCityDetail(){const c=cityData.find(x=>x.name===selectedCity);if(!c)return empty('Grad nije pronađen.');const s=cityStatus(c);return `<div class="eyebrow">OSVOJI SRBIJU</div><h1>${esc(c.name)}</h1><div class="card"><div class="row between"><span class="pill ${s.ready?'gold':''}">${s.won?'OSVOJEN':s.ready?'SPREMAN ZA IZAZOV':'GRAD U PRIPREMI'}</span><span class="gold"><strong>${s.count} / ${c.need}</strong> pitanja</span></div><div class="divider"></div><h2>Gradski izazov</h2><p class="muted">Za osvajanje potrebno je ${c.need} pitanja i ${Math.ceil(c.need*.8)} tačnih odgovora${c.need===3?' (sva tri)':'.'}</p>${s.ready?(isRegistered()?button('ZAPOČNI GRADSKI IZAZOV','cityStart','gold block'):button('PROBAJ GRADSKI IZAZOV','cityPreview','gold block')):s.count?button('ISPROBAJ DOSTUPNA PITANJA','cityPreview','secondary block'):empty('Još nema odobrenih pitanja za ovaj grad.')}${s.ready?'<p class="tiny muted">Zvanično osvajanje zahteva registrovan nalog i povezanu bazu.</p>':'<p class="tiny muted">Čim analize TRAG 24 daju dovoljno pitanja, ovaj grad će se automatski otključati.</p>'}</div><div style="margin-top:16px">${button('← NA MAPU SRBIJE','goto','ghost','data-page="cities"')}</div>`}
function layoutProfile(){if(!isRegistered()){const xp=state.practiceXP||0;return `<div class="eyebrow">MOJ PROFIL</div><h1>${esc(state.guestName||'Gost')}</h1><div class="profile-avatar">◉</div><div style="text-align:center"><span class="pill">Probni nalog na ovom uređaju</span></div><div class="grid3"><div class="stat"><strong>${state.history.length}</strong><span>Partija</span></div><div class="stat"><strong>${nfmt(xp)}</strong><span>Probni XP</span></div><div class="stat"><strong>${state.conquests.length}</strong><span>Gradova</span></div></div><div class="card"><h2>Sačuvaj pravi profil</h2><p>Registruj se e-mailom da dobiješ jedinstven nadimak, serverske rezultate, rangiranje, zvanične duele i osvajanja gradova.</p>${button('REGISTRUJ SE','goto','gold block','data-page="signup"')}<div style="margin-top:12px">${button('PROMENI NAZIV ZA PROBU','guestSetup','secondary block')}</div></div><p class="tiny muted">Probni rezultati su lokalni. Brisanje podataka pregledača može ih ukloniti.</p>`}
return `<div class="eyebrow">MOJ PROFIL</div><h1>${esc(myProfile.nickname)}</h1><div class="profile-avatar">★</div><p style="text-align:center" class="muted">${esc(myProfile.country||'')}</p><div class="grid3"><div class="stat"><strong>${nfmt(myProfile.xp||0)}</strong><span>XP</span></div><div class="stat"><strong>${nfmt(myProfile.wins||0)}</strong><span>Pobede</span></div><div class="stat"><strong>${nfmt(myProfile.city_conquests||0)}</strong><span>Gradova</span></div></div><div class="stack">${button('MOJE MEDALJE','goto','secondary block','data-page="medals"')}${button('RANG-LISTA','goto','secondary block','data-page="leaderboard"')}${button('ODJAVI SE','logout','ghost block')}</div>`}
function layoutGuestSetup(){return `<div class="eyebrow">PROBNI REŽIM</div><h1>Kako da te zovemo?</h1><p class="muted">Ovo nije registracija. Ime i poeni ostaju samo u tvom pregledaču.</p><form id="guest-form"><div class="field"><label for="guest-name">Nadimak (neobavezno)</label><input id="guest-name" maxlength="22" placeholder="Na primer: Sale24" value="${esc(state.guestName)}" /></div><div class="field"><label for="guest-country">Država</label><select id="guest-country">${countryOptions(state.guestCountry)}</select></div><button class="button gold block" type="submit">NASTAVI U IGRU</button></form>`}
const countries=['🇷🇸 Srbija','🇩🇪 Nemačka','🇦🇹 Austrija','🇨🇭 Švajcarska','🇺🇸 SAD','🇬🇧 Velika Britanija','🇫🇷 Francuska','🌍 Druga država'];
function countryOptions(chosen){return countries.map(x=>`<option ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')}
function layoutAuth(signup){const ready=backendConfigured;return `<div class="eyebrow">${signup?'POSTANI TAKMIČAR':'DOBRO DOŠAO NAZAD'}</div><h1>${signup?'Registracija':'Prijava'}</h1>${!ready?`<div class="notice warning"><strong>Registracija još nije aktivirana.</strong><br />Potrebno je povezati Supabase bazu. Gost režim i probna igra rade bez toga.</div>`:''}<form id="auth-form"><div class="field"><label for="auth-email">E-mail adresa</label><input id="auth-email" type="email" autocomplete="email" placeholder="ime@primer.com" required ${ready?'':'disabled'}/></div>${signup?`<div class="field"><label for="auth-nick">Jedinstveni nadimak</label><input id="auth-nick" maxlength="22" minlength="3" placeholder="Na primer: NewsMaster" required ${ready?'':'disabled'}/></div><div class="field"><label for="auth-country">Država</label><select id="auth-country" ${ready?'':'disabled'}>${countryOptions('🇷🇸 Srbija')}</select></div><div class="field"><label for="auth-city">Grad (neobavezno)</label><select id="auth-city" ${ready?'':'disabled'}><option value="">Izaberi kasnije</option>${cityData.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field small"><label style="font-weight:500"><input type="checkbox" id="auth-consent" style="width:auto;min-height:0" required ${ready?'':'disabled'}/> Prihvatam pravila igre i politiku privatnosti</label></div>`:''}<button class="button gold block" type="submit" ${ready?'':'disabled'}>${signup?'POŠALJI POTVRDU REGISTRACIJE':'POŠALJI LINK ZA PRIJAVU'}</button></form><p class="small muted">Link za pristup šalje se na potvrđenu e-mail adresu. Ne unosite lozinku u demonstraciju.</p><div class="stack">${button('PROBAJ BEZ REGISTRACIJE','guestStart','secondary block')}${button(signup?'VEĆ IMAM NALOG':'NEMAM NALOG','goto','ghost block',`data-page="${signup?'login':'signup'}"`)}</div>`}
function layoutLeaderBoard(){const cats=['Sve','Hronika','Društvo','Ekonomija','Politika','Sport','Svet','Zabava'];const periods=[['today','Danas'],['week','Nedelja'],['month','Mesec'],['all','Ukupno']];const local=state.history.slice().sort((a,b)=>b.points-a.points).slice(0,8);const backendRows=isRegistered()?publicLeaderboard:[];return `<div class="eyebrow">TAKMIČENJE</div><h1>Svetska rang-lista</h1><p class="muted small">Prava rang-lista prikazuje isključivo serverski potvrđene rezultate registrovanih igrača.</p><div class="filterrow">${periods.map(([k,n])=>`<button type="button" data-action="period" data-value="${k}" class="${k===boardPeriod?'on':''}">${n}</button>`).join('')}</div><div class="field"><label>Oblast</label><select id="category-filter">${cats.map(c=>`<option ${c===boardFilter?'selected':''}>${c}</option>`).join('')}</select></div>${isRegistered()?boardLoading?'<div class="loading">Učitavanje rang-liste...</div>':backendRows.length?backendRows.map((p,i)=>leaderRow(p,i)).join(''):empty('Za ovaj period još nema zvaničnih rezultata.'):empty('Svetska rang-lista biće dostupna čim povežemo bazu i registraciju. Ne prikazujemo izmišljene igrače.')}${title('Moji probni rezultati','<span class="pill">Samo ovaj uređaj</span>')}${local.length?local.map((p,i)=>leaderRow({nickname:state.guestName||'Gost',country:state.guestCountry,points:p.points,correct_count:p.correct,total_count:p.questionCount,detail:p.mode},i)).join(''):empty('Odigraj probnu partiju i ovde ćeš videti svoje rezultate.')}`}
function leaderRow(p,i){return `<div class="leader ${i===0?'first':''}"><span class="place">${['♛','2.','3.'][i]||(i+1)+'.'}</span><span class="who">${esc(p.nickname||p.name||'Igrač')}<small>${esc(p.country||'')} · ${p.correct_count??p.correct??0}/${p.total_count??p.questionCount??5} tačnih</small></span><span class="pts">${nfmt(p.points)}</span></div>`}
function layoutDuels(){return `<div class="eyebrow">TAKMIČENJE SA PRIJATELJIMA</div><h1>Izazovi prijatelja</h1><div class="card"><div class="trophy" style="font-size:55px;text-align:center">⚔</div><h2>Istih 5 pitanja. Jedan pobednik.</h2><p>Pošalji jedinstveni link prijatelju preko WhatsApp-a, Vibera ili drugih aplikacija. Ima 24 sata da odgovori.</p>${isRegistered()?button('NAPRAVI ZVANIČNI DUEL','createDuel','gold block'):button('REGISTRUJ SE ZA DUEL','goto','gold block','data-page="signup"')}</div><div class="notice warning">Bez registracije možeš da podeliš probnu igru, ali zvanični izazovi i rezultati zahtevaju povezanu bazu.</div><div class="stack">${button('PODELI IGRU PRIJATELJU','shareGame','secondary block')}${button('← GLAVNI MENI','goto','ghost block','data-page="home"')}</div>`}
function layoutInvite(){return `<div class="eyebrow">IZAZOV PRIJATELJA</div><h1>Pozvan si u duel!</h1><p class="muted">Da bi rezultat bio uporediv i sačuvan, duel zahteva potvrđen nalog. Ista pitanja dobijaju oba igrača.</p><div class="card"><h2>TRAG 24 ARENA duel</h2><p>Pet pitanja · 15 sekundi · Rok 24 sata</p>${isRegistered()?button('PRIHVATI IZAZOV','joinDuel','gold block'):button('PRIJAVI SE / REGISTRUJ','goto','gold block','data-page="signup"')}</div>${button('PRVO PROBAJ IGRU','guestStart','secondary block')}`}
function layoutMedals(){const medals=[['🏅','Prva partija',state.history.length>=1],['🎯','Pet tačnih odgovora',state.history.some(p=>p.correct>=5)],['⚡','10 odigranih partija',state.history.length>=10],['🏆','Nedeljni šampion',false],['⚔','Prva pobeda u duelu',false],['⌖','Prvi osvojen grad',state.conquests.length>=1],['♛','Majstor Hronike',false],['🌟','Legenda Arene',false]];return `<div class="eyebrow">NAPREDAK</div><h1>Medalje i dostignuća</h1><p class="muted">Probne medalje vidljive su samo na ovom uređaju. Zvanične medalje traže registrovan nalog.</p><div class="medal-grid">${medals.map(([emoji,label,earned])=>`<div class="medal ${earned?'':'locked'}"><div class="picture">${emoji}</div><strong>${esc(label)}</strong><small>${earned?'Otključano':'Zaključano'}</small></div>`).join('')}</div>`}
function render(){topHeader();let html='';switch(page){case'welcome':html=layoutWelcome();break;case'home':html=layoutHome();break;case'quiz':html=layoutQuiz();break;case'result':html=layoutResult();break;case'cities':html=layoutCities();break;case'cityDetail':html=layoutCityDetail();break;case'profile':html=layoutProfile();break;case'guestSetup':html=layoutGuestSetup();break;case'signup':html=layoutAuth(true);break;case'login':html=layoutAuth(false);break;case'leaderboard':html=layoutLeaderBoard();break;case'duels':html=layoutDuels();break;case'invite':html=layoutInvite();break;case'medals':html=layoutMedals();break;case'dailyIntro':html=screenQuizIntro('daily');break;case'largeIntro':html=screenQuizIntro('large');break;case'detectiveIntro':html=screenQuizIntro('detective');break;default:html=layoutHome()};ROOT.innerHTML=html}
async function api(action,extra={}){if(!backend||!currentUser)throw Error('Registracija i server nisu povezani.');const {data:{session}}=await backend.auth.getSession();if(!session)throw Error('Prijavi se ponovo.');const url=CONFIG.supabaseUrl.replace(/\/$/,'')+'/functions/v1/'+(CONFIG.edgeFunction||'arena-api');const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':CONFIG.supabaseAnonKey},body:JSON.stringify({action,...extra})});const obj=await r.json().catch(()=>({}));if(!r.ok||obj.error)throw Error(obj.error||'Serverska greška '+r.status);return obj}
async function officialStart(mode,params={}){if(!isRegistered()){navigate('signup');return}try{toast('Pripremam zvanični izazov...');const d=await api('start',{mode,...params});run={mode,official:true,sessionId:d.session_id,total:d.total,questions:[],currentQuestion:d.question,idx:d.current_index||0,points:d.score||0,correct:d.correct_count||0,answers:[],jokerUsed:{half:false,extra:false,double:false},pendingHelps:[],jokerQuestionCount:0,risk:false,removed:[],feedback:null,done:false,city:params.city||null,deadline:Date.parse(d.question.deadline_at)||Date.now()+15000,seconds:15};page='quiz';render();startTimer()}catch(e){toast('Zvanična partija nije pokrenuta: '+e.message)}}
async function createDuel(){if(!isRegistered()){navigate('signup');return}try{const d=await api('create_duel');const url=location.origin+location.pathname+'?duel='+encodeURIComponent(d.duel_id);await shareLink('Izazivam te na TRAG 24 ARENA! Igraj istih 5 pitanja i pokušaj da me pobediš.',url);toast('Duel je kreiran. Odigraj svojih pet pitanja!');await officialStart('duel',{duel_id:d.duel_id});}catch(e){toast(e.message)}}
async function joinDuel(){if(!activeInvite)return;await officialStart('duel',{duel_id:activeInvite})}
async function refreshLeaderboard(){if(!isRegistered()){publicLeaderboard=[];return}boardLoading=true;render();try{const d=await api('leaderboard',{period:boardPeriod,category:boardFilter});publicLeaderboard=d.players||[]}catch(e){publicLeaderboard=[];toast('Rang-lista nije učitana: '+e.message)}finally{boardLoading=false;render()}}
async function logout(){if(backend){await backend.auth.signOut()}currentUser=null;myProfile=null;navigate('welcome')}
async function shareLink(text,url){try{if(navigator.share){await navigator.share({title:'TRAG 24 ARENA',text,url});return}if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+url);toast('Link je kopiran.');return}}catch(e){if(e.name==='AbortError')return}toast('Link za deljenje: '+url)}
function shareGame(){shareLink('Probaj TRAG 24 ARENA — kviz iz analiza TRAG 24!',location.origin+location.pathname)}
function shareResult(){if(!run)return;shareLink(`Na TRAG 24 ARENA sam osvojio ${nfmt(run.points)} poena (${run.correct} tačnih)! Možeš li bolje?`,location.origin+location.pathname)}
async function authSubmit(form){if(!backend)throw Error('Baza nije podešena.');const email=form.querySelector('#auth-email').value.trim();if(!email)throw Error('Unesi e-mail adresu.');const reg=page==='signup';if(reg){const nick=form.querySelector('#auth-nick').value.trim();if(nick.length<3)throw Error('Nadimak mora imati najmanje 3 znaka.');if(!form.querySelector('#auth-consent').checked)throw Error('Prihvati pravila i politiku privatnosti.');save('arena_pending_profile',{nickname:nick,country:form.querySelector('#auth-country').value,city:form.querySelector('#auth-city').value})}const destination=location.origin+location.pathname;const {error}=await backend.auth.signInWithOtp({email,options:{emailRedirectTo:destination}});if(error)throw error;toast('Proveri e-mail — poslali smo link za prijavu.');navigate('welcome')}
async function loadProfile(){if(!backend||!currentUser)return;const {data,error}=await backend.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();if(error)throw error;if(data){myProfile=data;return}const pending=read('arena_pending_profile',null);if(!pending||!pending.nickname){toast('Nalog je potvrđen. Dovrši profil da bi se takmičio.');return}const {data:inserted,error:saveError}=await backend.from('profiles').insert({id:currentUser.id,nickname:pending.nickname,country:pending.country,city:pending.city||null}).select('*').single();if(saveError){toast('Nadimak je možda zauzet: '+saveError.message);return}myProfile=inserted;try{localStorage.removeItem('arena_pending_profile')}catch{}}
async function setupAuth(){if(!backendConfigured)return;try{if(!window.supabase?.createClient){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';s.onload=resolve;s.onerror=()=>reject(Error('Supabase biblioteka nije dostupna.'));document.head.append(s)})}backend=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});const {data:{session}}=await backend.auth.getSession();if(session){currentUser=session.user;await loadProfile()}backend.auth.onAuthStateChange(async(_event,session)=>{if(session?.user){currentUser=session.user;try{await loadProfile()}catch(e){toast('Profil nije učitan: '+e.message)}}else{currentUser=null;myProfile=null}render()});render()}catch(e){toast('Prijava nije spremna: '+e.message)}}
async function loadCurrentQuestions(){try{const r=await fetch(CONFIG.questionSource||'arena-pitanja.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(Array.isArray(d.questions)&&d.questions.length>=5){allQuestions=d.questions.filter(q=>q.quality_status==='approved'||q.quality_status==='reviewed_seed');render()}}catch{ /* bundled fallback for offline/file preview */}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(el.tagName==='A')e.preventDefault();switch(action){case'goto':navigate(el.dataset.page);break;case'guestStart':beginLocal('quick');break;case'guestSetup':navigate('guestSetup');break;case'quickStart':if(isRegistered())officialStart('quick');else beginLocal('quick');break;case'largeStart':if(isRegistered())officialStart('large');else beginLocal('large');break;case'dailyIntro':navigate('dailyIntro');break;case'dailyStart':officialStart('daily');break;case'detectiveIntro':navigate('detectiveIntro');break;case'detectiveStart':beginLocal('detective');break;case'answer':if(run?.official)await submitServer(Number(el.dataset.answer));else submitLocal(Number(el.dataset.answer));break;case'half':useJoker('half');break;case'extra':useJoker('extra');break;case'double':useJoker('double');break;case'next':next();break;case'newFromResult':if(isRegistered())officialStart(run?.mode==='large'?'large':'quick');else beginLocal(run?.mode==='large'?'large':'quick');break;case'city':selectedCity=el.dataset.city;navigate('cityDetail');break;case'cityPreview':{const cnt=cityCounts()[selectedCity]||0;beginLocal('city',{city:selectedCity,count:Math.min(cnt,5)});break}case'cityStart':if(!isRegistered()){toast('Za zvanično osvajanje potrebna je registracija. Možeš probati pitanja kao gost.');return}officialStart('city',{city:selectedCity});break;case'createDuel':await createDuel();break;case'joinDuel':await joinDuel();break;case'shareGame':shareGame();break;case'shareResult':shareResult();break;case'logout':await logout();break;case'period':boardPeriod=el.dataset.value;refreshLeaderboard();break;default:console.warn('Unknown action',action)}});
ROOT.addEventListener('change',e=>{if(e.target.id==='category-filter'){boardFilter=e.target.value;refreshLeaderboard()}});
ROOT.addEventListener('submit',async e=>{if(e.target.id==='guest-form'){e.preventDefault();state.guestName=e.target.querySelector('#guest-name').value.trim().slice(0,22);state.guestCountry=e.target.querySelector('#guest-country').value;persist();navigate('home')}else if(e.target.id==='auth-form'){e.preventDefault();try{await authSubmit(e.target)}catch(err){toast(err.message)}}});
document.addEventListener('visibilitychange',()=>{if(page==='quiz'&&run&&!run.feedback&&document.visibilityState==='visible'&&Date.now()>=run.deadline){if(run.official)submitServer(-1);else submitLocal(-1)}});
async function boot(){const params=new URLSearchParams(location.search);activeInvite=params.get('duel');page=activeInvite?'invite':'welcome';render();loadCurrentQuestions();await setupAuth();if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}
boot();
})();

  </script>
</body>
</html>
