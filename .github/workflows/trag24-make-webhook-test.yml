name: TRAG24 - Make prijem 6 probnih emisija (NEMA OBJAVE)

on:
  push:
    branches:
      - 'feature/trag24-reels-six-programs-20261121'
    paths:
      - '.github/workflows/trag24-make-webhook-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook_test:
    name: Jednokratni test prijema u Make (bez objave)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Proveri probni JSON
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('docs/make-webhook-sest-proba.json').read_text(encoding='utf-8'))
          assert v['mode']=='PREVIEW_ONLY' and v['publish_enabled'] is False and v['test_only'] is True
          assert len(v['posts'])==6
          assert all(p['publishing_enabled'] is False and p['media_url'] is None for p in v['posts'])
          print('6 probnih emisija, nijedna ne dozvoljava objavljivanje.')
          PY
      - name: Posalji samo testne podatke tajnim Make webhookom
        env:
          HOOK: ${{ secrets.MAKE_REELS_TEST_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::error::Nedostaje MAKE_REELS_TEST_WEBHOOK_URL u GitHub Actions Secrets."
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 30 --retry 0 \
            --request POST --header 'Content-Type: application/json' \
            --data-binary @docs/make-webhook-sest-proba.json \
            --output /tmp/make-response.txt --write-out '%{http_code}' "$HOOK")
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::error::Make prijem nije potvrdjen (HTTP $code)."
            exit 1
          fi
          echo "Make prihvatio probni paket od 6 stavki. HTTP $code."
          echo "Ovaj workflow nema vezu sa Instagram, Facebook ili TikTok API-jem."
