name: TRAG 24 - PREMIUM DNEVNI PROGRAMI

on:
  push:
    paths:
      - 'scripts/generate_daily_programs.py'
      - '.github/workflows/trag24-dnevni-programi.yml'
  workflow_dispatch:
    inputs:
      program:
        description: 'Izaberi emisiju'
        required: true
        default: '11'
        type: choice
        options: ['11', '14', '17', '23']
      date:
        description: 'Datum YYYY-MM-DD (prazno = danas)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '45 10 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 13 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 16 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 22 * * *'
      timezone: 'Europe/Belgrade'

permissions:
  contents: write

concurrency:
  group: trag24-premium-dnevni-programi
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'TRAG24 workflow OK'
