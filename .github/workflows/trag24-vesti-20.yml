name: TRAG 24 - VESTI U 20

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *'
      timezone: 'Europe/Belgrade'
    - cron: '45 19 * * *'
      timezone: 'Europe/Belgrade'

permissions:
  contents: write

concurrency:
  group: trag24-vesti-20
  cancel-in-progress: false

jobs:
  vesti:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Kontrola emisije
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Europe/Belgrade
        run: |
          set -euo pipefail

          DATE=$(date +%F)
          echo "$DATE" > datum.txt
          TAG="vesti-$DATE-20"

          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "official=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then

            if [ "$(date +%H)" != "19" ]; then
              echo "Pokretanje van termina."
              exit 0
            fi

            if gh release view "$TAG" --json assets,isDraft \
              --jq '(.isDraft == false) and any(.assets[]; .name == "TRAG24-VESTI-U-20.mp4" and .size > 0)' \
              2>/dev/null | grep -qx true; then

              echo "Vec postoji zvanicna emisija."
              exit 0
            fi

            echo "official=true" >> "$GITHUB_OUTPUT"
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: AI urednik dnevnih vesti
        if: steps.plan.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          today = open("datum.txt").read().strip()

          with open("analize.json", encoding="utf-8") as f:
              data = json.load(f)

          news = [
              a for a in data["analize"]
              if a.get("datum") == today
              and a.get("status") == "objavljeno"
          ]

          if not news:
              raise SystemExit("Nema danasnjih analiza.")

          prompt = """
          Ti si profesionalni urednik
          informativne emisije TRAG 24.

          Sastavi tekst za televizijskog spikera.

          PRAVILA:
          - Srpski jezik, latinica, ekavica.
          - Profesionalan i neutralan govor.
          - Obuhvati relevantne dnevne teme.
          - Spoji ponovljene vesti.
          - Najvaznije teme idu prve.
          - Ne izmisljaj informacije.
          - Iskljuci zastarele dogadjaje.
          - Navode medija pripisi izvorima.
          - Optuzbe nisu dokazane cinjenice.
          - Bez senzacionalizma.
          - Bez politickog navijanja.
          - Najvise 170 reci.
          - Bez naslova, uvoda i odjave.
          - Brojeve pisi recima.
          - Vrati samo tekst za spikera.
          - Ako nema aktuelnih tema,
            vrati samo NEMA_VESTI.
          """

          prompt += "\nDatum: " + today
          prompt += "\nAnalize:\n" + json.dumps(
              news, ensure_ascii=False
          )

          body = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "temperature": 0.3,
                  "maxOutputTokens": 4096
              }
          }

          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              }
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              result = json.load(response)

          parts = result["candidates"][0]["content"]["parts"]

          tekst = " ".join(
              p.get("text", "") for p in parts
              if not p.get("thought", False)
          ).strip()

          if not tekst or "NEMA_VESTI" in tekst:
              raise SystemExit("Nema aktuelnih vesti.")

          if len(tekst.split()) > 190:
              raise SystemExit("Tekst je predugacak.")

          uvod = (
              "Dobro veče. Pratite Trag dvadeset četiri. "
              "Donosimo vam pregled najvažnijih događaja "
              "koji su obeležili današnji dan."
          )

          kraj = (
              "Hvala na pažnji. Pratite nas i budite u toku. "
              "Trag dvadeset četiri, vaš trag do informacija."
          )

          final = uvod + "\n\n" + tekst + "\n\n" + kraj

          with open("vesti.txt", "w", encoding="utf-8") as f:
              f.write(final)

          print(final)
          PY

      - name: Gemini Lumi
        if: steps.plan.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          curl -fsS -G \
            "https://generativelanguage.googleapis.com/v1beta/voices" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            --data-urlencode "search=Lumi" > voices.json

          VOICE=$(jq -er '[.voices[] | select(.displayName == "Lumi" or .display_name == "Lumi") | .id] | unique | if length == 1 then .[0] else error("Lumi ID nije jednoznacan") end' voices.json)

          TEXT=$(cat vesti.txt)

          jq -n --arg voice "$VOICE" --arg text "$TEXT" '{
            model: "gemini-3.8-flash-lite-tts",
            input: [{type:"user_input",content:[{type:"text",text:$text,annotations:[{type:"speech_metadata",style:"friendly and professional"}]}]}],
            response_format: {type:"audio"},
            generation_config: {speech_config:[{voice:$voice}]}
          }' > request.json

          curl -fsS --max-time 120 \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json > response.json

          jq -er '[.steps[] | select(.type=="model_output") | .content[] | select(.type=="audio")] | last | .data' response.json | base64 -d > glas.wav

          test -s glas.wav

      - name: Brza montaza
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail

          pip install --only-binary=:all: imageio-ffmpeg==0.6.0

          FF=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')

          VIDEO=trag24-vesti-podloga.mov

          if [ ! -f "$VIDEO" ]; then
            VIDEO=trag24-vesti-podloga.mp4
          fi

          test -s "$VIDEO"

          DUR=$(python -c 'import wave; w=wave.open("glas.wav"); print(w.getnframes()/w.getframerate())')

          TEMPO=$(python -c 'import sys; d=float(sys.argv[1]); assert 0<d<=115; print(max(1,d/86))' "$DUR")

          INFO=$("$FF" -hide_banner -i "$VIDEO" 2>&1 || true)

          if grep -q "Video: h264" <<< "$INFO"; then
            CODEC=(-c:v copy)
          else
            CODEC=(-c:v libx264 -preset ultrafast -pix_fmt yuv420p)
          fi

          "$FF" -hide_banner -loglevel error \
            -nostdin -y -stream_loop -1 \
            -i "$VIDEO" -i glas.wav \
            -filter_complex "[0:a]volume=5,apad,atrim=duration=90[m];[1:a]atempo=$TEMPO,loudnorm=I=-17:TP=-2:LRA=7,adelay=1000:all=1,apad,atrim=duration=90[g];[m][g]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.95:level=0[a]" \
            -map 0:v:0 -map '[a]' \
            -t 89.5 "${CODEC[@]}" \
            -c:a aac -b:a 160k -ar 48000 \
            -ac 2 -movflags +faststart \
            TRAG24-VESTI-U-20.mp4

          test -s TRAG24-VESTI-U-20.mp4

      - name: Sacuvaj emisiju
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TRAG24-VESTI-U-20
          path: |
            TRAG24-VESTI-U-20.mp4
            vesti.txt
          retention-days: 7
          if-no-files-found: error

      - name: Objavi zvanicnu emisiju
        if: steps.plan.outputs.official == 'true' && steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Europe/Belgrade
        run: |
          set -euo pipefail

          DATE=$(cat datum.txt)
          TAG="vesti-$DATE-20"

          if [ "$(date +%H)" != "19" ]; then
            echo "Istekao termin za pripremu."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              TRAG24-VESTI-U-20.mp4 --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" \
              TRAG24-VESTI-U-20.mp4 \
              --target "$GITHUB_SHA" \
              --title "TRAG 24 - VESTI U 20 - $DATE" \
              --notes "Zvanicna vecernja emisija TRAG 24." \
              --latest=false
          fi

          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/TRAG24-VESTI-U-20.mp4"
